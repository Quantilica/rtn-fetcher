[project]
name = "rtn-fetcher"
version = "0.7.0"
description = "RTN data fetching and export utilities"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "rtn",
    "tesouro-nacional",
    "fiscal",
    "brazil",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "quantilica-core>=0.19.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/rtn-fetcher"
Repository = "https://github.com/Quantilica/rtn-fetcher"
Issues = "https://github.com/Quantilica/rtn-fetcher/issues"

[project.scripts]
rtn-fetcher = "rtn_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
rtn = "rtn_fetcher.plugin:app"

[project.entry-points."quantilica.lake"]
rtn = "rtn_fetcher.lake:converter"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest-cov>=7.1",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    # Só para os testes: tests/test_catalog.py exercita o plugin Typer do
    # host (sync --dry-run). Nunca em [project].dependencies — o plugin
    # consome o que o host já traz.
    "quantilica-cli>=0.17.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/rtn_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]

[tool.coverage.run]
source = ["rtn_fetcher"]

[tool.coverage.report]
# Cobertura abaixo de 80%: relatório informativo (dispensa temporária, ver planning/notes/2026-11-04-ci-pyright-cobertura-dispensas.md).
show_missing = true
skip_covered = true
