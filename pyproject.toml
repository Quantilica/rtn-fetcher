[project]
name = "rtnpy"
version = "0.1.0"
description = "RTN data fetching and export utilities"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
rtnpy = "rtnpy:main"
