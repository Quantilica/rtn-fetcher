[project]
name = "rtn-fetcher"
version = "0.4.0"
description = "RTN data fetching and export utilities"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "rtn",
    "tesouro-nacional",
    "fiscal",
    "brazil",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "quantilica-core>=0.4.0",
    "quantilica-analytics>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/rtn-fetcher"
Repository = "https://github.com/Quantilica/rtn-fetcher"
Issues = "https://github.com/Quantilica/rtn-fetcher/issues"

[project.scripts]
rtn-fetcher = "rtn_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
rtn = "rtn_fetcher.plugin:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/rtn_fetcher"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
