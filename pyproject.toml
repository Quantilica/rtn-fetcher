[project]
name = "rtnpy"
version = "0.1.0"
description = "RTN data fetching and export utilities"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
polars = ["polars>=1.0.0"]
all = ["pandas>=2.0.0", "polars>=1.0.0"]

[project.scripts]
rtnpy = "rtnpy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtnpy"]
